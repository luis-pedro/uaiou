name: uaiou
description: "UaiOu — aplicativo de entregas que conecta estabelecimentos e entregadores."
publish_to: 'none'

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  flutter_map: ^8.2.1
  latlong2: ^0.9.1

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_secure_storage: ^11.0.0
  provider: ^6.1.5+1
  geolocator: ^14.0.3
  image_picker: ^1.2.3
  permission_handler: ^13.0.0
  intl: ^0.20.3
  # RF-A13.6 — versão real do pacote enviada em POST /me/devices.
  package_info_plus: ^10.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/imagens/